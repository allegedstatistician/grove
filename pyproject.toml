[project]
name = "grove"
version = "0.1.0"
description = "A git worktree and checkpoint manager, built to learn git internals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygit2>=1.15",
]

[project.scripts]
grove = "grove.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grove"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
